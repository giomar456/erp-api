name: Oracle Health Check

# PRODUCCION = Oracle Cloud VM (NO Render).
# Este workflow solo vigila Oracle. Render queda suspendido a proposito.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  ORACLE_URL: http://64.181.176.160:8000

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Health Oracle + DB
        run: |
          set -uo pipefail
          URL="${ORACLE_URL}/health?db=1"
          code=$(curl -sS -o /tmp/body.txt -w "%{http_code}" --connect-timeout 15 --max-time 40 "$URL" || echo "000")
          body=$(head -c 300 /tmp/body.txt || true)
          echo "HTTP $code"
          echo "$body"
          if [ "$code" != "200" ]; then
            echo "::error::Oracle ERP no responde en $URL"
            exit 1
          fi
          if ! echo "$body" | grep -q '"ok":true'; then
            echo "::error::Health no ok"
            exit 1
          fi
          echo "Oracle OK — producción activa en 64.181.176.160:8000"
