name: Render Keep Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping ERP health
        run: curl -fsS --max-time 60 "https://erp-api-7x3d.onrender.com/health"

      - name: Warm productos lite
        run: curl -fsS --max-time 90 "https://erp-api-7x3d.onrender.com/productos?lite=1&sucursal=computer_army" -o /dev/null

      - name: Warm ERP web shell
        run: curl -fsS --max-time 60 "https://erp-api-7x3d.onrender.com/erp/" -o /dev/null