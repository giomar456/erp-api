name: Oracle Keep Alive

# Pings HTTPS publico (Caddy). El puerto 8000 solo escucha en localhost.
# Oracle Always Free NO se duerme como Render; esto detecta caidas y avisa.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  ORACLE_URL: https://64.181.176.160.sslip.io

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping Oracle (reintentos)
        run: |
          set -uo pipefail
          ok=0
          for i in 1 2 3; do
            echo "=== Intento $i/3 ==="
            code=$(curl -sS -k -o /tmp/body.txt -w "%{http_code}" \
              --connect-timeout 12 --max-time 25 \
              "${ORACLE_URL}/health?db=1" || true)
            [ -z "$code" ] && code=000
            body=$(head -c 400 /tmp/body.txt 2>/dev/null || true)
            echo "HTTP $code"
            echo "$body"
            if [ "$code" = "200" ] && echo "$body" | grep -q '"ok":true'; then
              ok=1
              break
            fi
            sleep 5
          done

          curl -sS -k --connect-timeout 10 --max-time 20 "${ORACLE_URL}/health" -o /dev/null || true
          curl -sS -k --connect-timeout 10 --max-time 20 "${ORACLE_URL}/erp/" -o /dev/null || true

          if [ "$ok" != "1" ]; then
            echo "::error::Oracle no respondio health+db. Revisa VM 64.181.176.160 y docker."
            exit 1
          fi
          echo "Oracle Keep Alive OK"
